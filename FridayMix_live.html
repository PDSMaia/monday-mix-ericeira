<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0B1110"/>
<title>Friday Mix in Ericeira — ao vivo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap"/>
<style>
:root{
  --ground:#0B1110;--surface:#131C1A;--surface-2:#1B2724;--line:#26332F;--line-soft:#1E2A27;
  --ink:#E9F1EE;--ink-2:#A8BCB6;--ink-3:#6F847E;
  --live:#35E39B;--down:#FF6B6B;--gold:#F2C14C;--silver:#C3CEC9;--bronze:#E08A5B;
  --c1:#35E39B;--c2:#5AA9FF;--c3:#F2B24C;--c4:#B98CFF;
  --disp:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ground);color:var(--ink);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:640px;margin:0 auto;padding:1.25rem 14px 3.5rem;}

.header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(140deg,#8FF6D2,var(--live) 45%,#0F6E56);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-inner{width:20px;height:20px;border:2.5px solid #0B1110;border-radius:50%;position:relative;}
.logo-inner::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:2px;background:#0B1110;border-radius:2px;}
h1{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);line-height:1.2;}
.subtitle{font-size:12.5px;color:var(--ink-3);margin-top:3px;}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:1.25rem;}
.tab{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;border:0;background:none;border-radius:8px;padding:9px 4px;margin:0;white-space:nowrap;transition:color .15s,background .15s;}
.tab:hover{color:var(--ink-2);}
.tab.active{background:var(--surface-2);color:var(--ink);}
.section{display:none;}.section.active{display:block;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:14px;}
.card-title{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:12px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}

label{font-family:var(--disp);font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px;}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--surface-2);color:var(--ink);outline:none;font-family:var(--body);}
input[type=text]:focus{border-color:var(--live);box-shadow:0 0 0 2px rgba(53,227,155,.18);}
textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:var(--body);background:var(--surface-2);color:var(--ink);outline:none;resize:vertical;line-height:1.5;}
textarea:focus{border-color:var(--live);box-shadow:0 0 0 2px rgba(53,227,155,.18);}
textarea::placeholder,input::placeholder{color:var(--ink-3);}

.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);transition:background .12s,color .12s,transform .1s;font-family:var(--body);}
.btn:hover{color:var(--ink);border-color:var(--ink-3);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--live);color:var(--ground);border-color:var(--live);}
.btn-primary:hover{background:#2ccf8c;border-color:#2ccf8c;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--down);border-color:transparent;background:transparent;}
.btn-danger:hover{background:rgba(255,107,107,.12);}
.btn-icon{padding:3px 7px;font-size:12px;line-height:1.2;}

.insc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(max-width:520px){.insc-grid{grid-template-columns:1fr;}}
.insc-row{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;}
.insc-num{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--live);text-align:center;}

.ordem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
@media(max-width:520px){.ordem-grid{grid-template-columns:1fr;}}
.pl-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--surface-2);margin-bottom:5px;font-size:13px;color:var(--ink-2);}
.pl-ord{font-size:11px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums;}
.pl-nome{font-weight:600;color:var(--ink);}
.court-head{font-family:var(--disp);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px;font-weight:600;}
.court-head:first-child{margin-top:0;}

.ronda-block{margin-bottom:1.25rem;}
.ronda-title{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ronda-badge{font-family:var(--disp);font-size:11px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-weight:600;text-transform:none;letter-spacing:0;border:1px solid var(--line);}
.ronda-badge.ok{background:rgba(53,227,155,.12);color:var(--live);border-color:rgba(53,227,155,.3);}

.partida-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 17px;margin-bottom:8px;overflow:hidden;}
.partida-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--court,var(--line));}
.partida-top{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
.campo-badge{font-family:var(--disp);font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;letter-spacing:.03em;}
.c1{background:rgba(53,227,155,.14);color:var(--c1);}.c2{background:rgba(90,169,255,.14);color:var(--c2);}
.c3{background:rgba(242,178,76,.16);color:var(--c3);}.c4{background:rgba(185,140,255,.16);color:var(--c4);}
.tier{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.badge-done{background:rgba(53,227,155,.12);color:var(--live);font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;}
.badge-pending{background:var(--surface-2);color:var(--ink-3);font-size:11px;padding:2px 9px;border-radius:999px;}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.team-left{font-family:var(--disp);font-size:14.5px;font-weight:600;color:var(--ink-2);line-height:1.35;}
.team-right{font-family:var(--disp);font-size:14.5px;font-weight:600;color:var(--ink-2);line-height:1.35;text-align:right;}
.score-center{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.score-inp{width:34px;padding:4px 2px;text-align:center;border:1px solid var(--line);border-radius:8px;font-family:var(--disp);font-size:16px;font-weight:700;background:var(--surface-2);color:var(--ink);outline:none;}
.score-inp:focus{border-color:var(--live);}
.score-sep{font-size:14px;color:var(--ink-3);}
.partida-footer{display:flex;align-items:center;margin-top:8px;gap:8px;}

.cl-table{width:100%;border-collapse:collapse;font-size:13px;}
.cl-table th{font-family:var(--disp);padding:0 9px 8px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.07em;text-transform:uppercase;text-align:left;}
.cl-table th.r{text-align:right;}
.cl-table td{padding:9px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);font-variant-numeric:tabular-nums;}
.cl-table td.r{text-align:right;}
.cl-table tr:last-child td{border-bottom:none;}
.pos-badge{font-family:var(--disp);font-weight:700;font-size:14px;display:inline-block;width:20px;text-align:center;}
.p1{color:var(--gold);}.p2{color:var(--silver);}.p3{color:var(--bronze);}.pn{color:var(--ink-3);}
.winner-strip{border:1px solid rgba(242,193,76,.4);border-radius:12px;padding:14px 15px;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:12px;background:radial-gradient(120% 100% at 50% 0,rgba(242,193,76,.16),transparent 65%),var(--surface);text-align:center;}

.empty{border:1px dashed var(--line);border-radius:12px;text-align:center;padding:2.2rem 1rem;color:var(--ink-3);font-size:14px;}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface);}
.alert-ok{color:var(--live);border-color:rgba(53,227,155,.3);background:rgba(53,227,155,.08);}
.alert-warn{color:var(--gold);border-color:rgba(242,193,76,.3);background:rgba(242,193,76,.08);}
.alert-err{color:var(--down);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08);font-weight:500;}
.note{font-size:11px;color:var(--ink-3);margin-top:8px;padding:6px 10px;background:var(--surface-2);border-radius:8px;}
.topbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:4px;}
.livepill{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.05em;color:var(--ink-3);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.9s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;}}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="logo"><div class="logo-inner"></div></div>
  <div>
    <h1>Friday Mix in Ericeira</h1>
    <p class="subtitle">Evento · Sobe e Desce · 16 jogadores · 4 campos · 5 rondas</p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="goTab('inscricoes',this)">Inscrições</button>
  <button class="tab" onclick="goTab('partidas',this)">Partidas</button>
  <button class="tab" onclick="goTab('class',this)">Classificação</button>
</div>

<div id="alert-box"></div>

<!-- INSCRIÇÕES -->
<div class="section active" id="tab-inscricoes">
  <div class="card">
    <div class="card-header">
      <span class="card-title" style="margin:0;">Estado do evento</span>
      <div class="topbar">
        <span class="livepill"><span class="pulse"></span>ao vivo</span>
        <button class="btn btn-sm" onclick="reloadState()">↻ Actualizar</button>
        <span style="font-size:11px;color:var(--ink-3);" id="last-updated"></span>
      </div>
    </div>
    <div id="estado-info" style="font-size:13px;color:var(--ink-3);"></div>
  </div>

  <div id="sec-form">
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="margin:0;">Inscrever 16 jogadores</span>
        <button class="btn btn-sm" onclick="limparForm()">Limpar</button>
      </div>
      <p class="note" style="margin:0 0 12px;">A ordem de inscrição define as duplas e os campos da Ronda 1.</p>
      <div style="margin-bottom:14px;">
        <label>Importar lista (aceita 1️⃣, 🔟, "1.", "1 -", 🎾, etc. — podes colar a mensagem toda: só é lido entre "Players:" e "Extras:")</label>
        <textarea id="bulk" rows="4" placeholder="1️⃣ Paulo Maia&#10;2️⃣ Frederico Carvalho&#10;..."></textarea>
        <div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-sm" onclick="importarLista()">Importar nomes</button>
          <span id="bulk-info" style="font-size:11px;color:var(--ink-3);"></span>
        </div>
      </div>
      <div class="insc-grid" id="insc-inputs"></div>
      <datalist id="ranking-list"></datalist>
      <div style="margin-top:1rem;">
        <button class="btn btn-primary" onclick="confirmarInscricoes()">Confirmar inscrições</button>
      </div>
    </div>
  </div>

  <div id="sec-ordem" style="display:none;">
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="margin:0;">Jogadores por campo (Ronda 1)</span>
      </div>
      <div id="ordem-content"></div>
      <div id="ordem-actions" style="margin-top:1rem;"></div>
    </div>
  </div>
</div>

<!-- PARTIDAS -->
<div class="section" id="tab-partidas">
  <div id="partidas-container"></div>
  <div id="next-round-wrap"></div>
</div>

<!-- CLASSIFICAÇÃO -->
<div class="section" id="tab-class">
  <div id="class-container"></div>
</div>
</div>

<script>
const RANKING_3M=['Caike Demasi','Fábio Batalha','João Charneca','João Nunes','André Lima','Pedro Batalha','Francisco Matos','Rafael Silva','André Santos','Bruno Ramos','Gianni Fiermans','Pedro Penetra','Nuno Mendes','Bruno Bernabéu','Nuno Nunes','Frederico Carvalho','Bruno Pereira','Pedro Cruz','João Andrade','José Rosa','Daniel Cardoso','Alexandre Reis','Fábio Francisco','João Lopes','Ricardo Leitão','Pedro Falcão','Marcelo Zaccariotto','André Borgas','Tiago Valverde','Rui Morgado','Paulo Maia','Gonçalo Oliveira','Miguel Tavares','Vítor Antunes','Tiago Escudeiro','António Pechilga','Flávio Gonçalves'];

const CAMPOS=['Campo Powerade (1)','Campo 2','Campo Stella Artois (3)','Campo Exterior (4)'];
const CAMPO_CLS=['c1','c2','c3','c4'];
const N_JOG=16, N_CAMPOS=4, N_RONDAS=5;

const JSONBIN_KEY='$2a$10$1PIosVcfPwFi.oA0VV1dMuNeylfERzWKTyG4QDy0RQzLu7fQLhvYO';
const BIN_ID='6a7910a7f5f4af5e29003405';

let jogadores=[];                 // [{nome}] — índice = ordem de inscrição
let rascunho=Array.from({length:N_JOG},()=>({nome:''}));
let inscricoesFechadas=false;
let rounds=[];                    // [{matches:[{campo,pair1,pair2,scores,done,repetiu}]}]
let localVersion=0;
const viewOnly=true;

const norm=s=>(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const nomeOf=i=>jogadores[i]?.nome||'?';
const parKey=(a,b)=>[a,b].sort((x,y)=>x-y).join('|');

function goTab(id,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='partidas') renderPartidas();
  if(id==='class') renderClass();
  if(id==='inscricoes') renderInscricoes();
}
let alertTimer=null;
function showAlert(msg,type,fixo){
  const el=document.getElementById('alert-box');
  el.className='alert alert-'+type;el.textContent=msg;
  if(alertTimer){clearTimeout(alertTimer);alertTimer=null;}
  if(!fixo) alertTimer=setTimeout(()=>{el.textContent='';el.className='';},6000);
}

// ── INSCRIÇÕES ──
function renderInscricoes(){
  document.getElementById('ranking-list').innerHTML=RANKING_3M.map(n=>`<option value="${n}"></option>`).join('');
  const info=document.getElementById('estado-info');
  if(!inscricoesFechadas){
    info.textContent='Inscrições ainda por fechar.';
    document.getElementById('sec-form').style.display='none';
    document.getElementById('sec-ordem').style.display='none';
  } else {
    const nd=rounds.reduce((a,r)=>a+r.matches.filter(m=>m.done).length,0);
    const nt=rounds.reduce((a,r)=>a+r.matches.length,0);
    info.textContent=`Inscrições fechadas · ${rounds.length} de ${N_RONDAS} rondas geradas · ${nd} de ${nt} partidas registadas.`;
    document.getElementById('sec-form').style.display='none';
    document.getElementById('sec-ordem').style.display='block';
    renderOrdem();
  }
}

function renderForm(){
  document.getElementById('insc-inputs').innerHTML=rascunho.map((r,i)=>`
    <div class="insc-row">
      <div class="insc-num">${i+1}</div>
      <input type="text" list="ranking-list" id="jog${i}" value="${(r.nome||'').replace(/"/g,'&quot;')}" placeholder="Nome" oninput="rascunho[${i}].nome=this.value"/>
    </div>`).join('');
}

function limparLinha(l){
  return l.replace(/^[\s\u{1F3BE}\u{1F51F}0-9\uFE0F\u20E3().:\-\u2013\u2014\u2022*#]+/u,'').trim();
}
function resolverNome(n){
  const nn=norm(n);
  const exato=RANKING_3M.find(r=>norm(r)===nn);
  if(exato) return exato;
  const cand=RANKING_3M.filter(r=>{const rn=norm(r);return rn.includes(nn)||nn.includes(rn);});
  return cand.length===1?cand[0]:n;
}
// Reduz uma linha a letras/numeros para comparar com "players"/"extras"
// sem depender de maiusculas, acentos, emojis ou pontuacao.
const soLetras=s=>norm(s).replace(/[^a-z0-9]/g,'');
function importarLista(){
  const raw=document.getElementById('bulk').value||'';
  const linhas=raw.split(/\r?\n/);
  // Se a mensagem trouxer os marcadores "Players:"/"Extras:" (cabecalho, premio, regras...),
  // so se le o bloco entre eles - os Extras (lista de espera) e o rodape ficam sempre de fora.
  const iP=linhas.findIndex(l=>soLetras(l)==='players');
  let iE=-1;
  for(let i=(iP>=0?iP+1:0);i<linhas.length;i++){if(soLetras(linhas[i])==='extras'){iE=i;break;}}
  const bloco=linhas.slice(iP>=0?iP+1:0, iE>=0?iE:linhas.length);
  let nomes=bloco.map(limparLinha).filter(n=>n.length>1);
  const info=document.getElementById('bulk-info');
  if(!nomes.length){info.textContent='Nada para importar.';return;}
  const excesso=nomes.length>N_JOG?nomes.length-N_JOG:0;
  nomes=nomes.slice(0,N_JOG);
  rascunho=Array.from({length:N_JOG},()=>({nome:''}));
  nomes.forEach((n,i)=>rascunho[i]={nome:resolverNome(n)});
  renderForm();
  info.textContent=`${nomes.length} nomes importados.`+(excesso?` ${excesso} linha(s) a mais ignoradas.`:'')+(nomes.length<N_JOG?` Faltam ${N_JOG-nomes.length}.`:'');
}

function limparForm(){
  if(!confirm('Limpar todos os nomes?'))return;
  rascunho=Array.from({length:N_JOG},()=>({nome:''}));
  renderForm();
}

function confirmarInscricoes(){
  const nomes=[];
  for(let i=0;i<N_JOG;i++){
    const n=(document.getElementById('jog'+i)?.value||'').trim();
    if(!n){showAlert('Preenche os 16 jogadores.','warn');return;}
    nomes.push(n);
  }
  if(new Set(nomes.map(norm)).size!==N_JOG){showAlert('Há nomes repetidos — todos os jogadores devem ser distintos.','warn');return;}
  jogadores=nomes.map(n=>({nome:n}));
  rascunho=jogadores.map(j=>({nome:j.nome}));
  inscricoesFechadas=true;rounds=[];
  renderInscricoes();autoSave();
}
function voltarAoForm(){
  if(rounds.length&&!confirm('Editar os nomes vai apagar as rondas já geradas. Continuar?'))return;
  rascunho=jogadores.length?jogadores.map(j=>({nome:j.nome})):rascunho;
  inscricoesFechadas=false;rounds=[];
  renderInscricoes();
}
function resetEvento(){
  if(!confirm('Recomeçar o evento do zero? Perde-se tudo.'))return;
  jogadores=[];rounds=[];inscricoesFechadas=false;
  rascunho=Array.from({length:N_JOG},()=>({nome:''}));
  renderInscricoes();autoSave();
}

function renderOrdem(){
  const bloq=true;
  let col1='',col2='';
  for(let c=0;c<N_CAMPOS;c++){
    let bloco=`<div class="court-head">${CAMPOS[c]}</div>`;
    for(let k=0;k<4;k++){
      const idx=c*4+k;
      const j=jogadores[idx];if(!j)continue;
      bloco+=`<div class="pl-row">
        <div class="pl-ord">${idx+1}</div>
        <div class="pl-nome">${j.nome}</div>
        <div style="display:flex;gap:3px;">
          ${bloq?'':`<button class="btn btn-icon" title="Subir" onclick="moverJogador(${idx},-1)">↑</button>
          <button class="btn btn-icon" title="Descer" onclick="moverJogador(${idx},1)">↓</button>`}
        </div>
      </div>`;
    }
    if(c<2) col1+=bloco; else col2+=bloco;
  }
  document.getElementById('ordem-content').innerHTML=`<div class="ordem-grid"><div>${col1}</div><div>${col2}</div></div>`;

  document.getElementById('ordem-actions').innerHTML='';
}
function moverJogador(idx,dir){
  const alvo=idx+dir;
  if(alvo<0||alvo>=N_JOG)return;
  const t=jogadores[idx];jogadores[idx]=jogadores[alvo];jogadores[alvo]=t;
  renderOrdem();autoSave();
}
function apagarRondas(){
  if(!confirm('Apagar todas as rondas e resultados?'))return;
  rounds=[];renderInscricoes();autoSave();
}

// ── RONDAS ──
function gerarRonda1(){
  const matches=[];
  for(let c=0;c<N_CAMPOS;c++){
    const b=c*4;
    matches.push({campo:c,pair1:[b,b+1],pair2:[b+2,b+3],scores:[0,0],done:false,repetiu:false});
  }
  rounds=[{matches}];
  renderInscricoes();
  showAlert('Ronda 1 gerada. Vai a "Partidas" para registar resultados.','ok');
  autoSave();
}

function parceriasAte(r){
  const m=new Map();
  for(let i=0;i<r;i++) rounds[i].matches.forEach(x=>[x.pair1,x.pair2].forEach(p=>{
    const k=parKey(p[0],p[1]);m.set(k,(m.get(k)||0)+1);
  }));
  return m;
}
function vp(m){const[s1,s2]=m.scores;return s1>s2?{W:m.pair1,L:m.pair2}:{W:m.pair2,L:m.pair1};}

// classificação (rank 1..16) considerando as rondas já registadas
function rankMap(ateRonda){
  const st=jogadores.map((_,i)=>({idx:i,v:0,jg:0,jl:0}));
  for(let r=0;r<ateRonda;r++) rounds[r].matches.forEach(m=>{
    if(!m.done)return;
    const[s1,s2]=m.scores;
    m.pair1.forEach(i=>{st[i].jg+=s1;st[i].jl+=s2;if(s1>s2)st[i].v++;});
    m.pair2.forEach(i=>{st[i].jg+=s2;st[i].jl+=s1;if(s2>s1)st[i].v++;});
  });
  const ord=[...st].sort((a,b)=>b.v-a.v||(b.jg-b.jl)-(a.jg-a.jl));
  const map={};ord.forEach((s,i)=>map[s.idx]=i+1);
  return map;
}

// junta dois pares que chegam ao campo; ambos se separam
function melhorCombinacao(X,Y,parcerias,rank){
  const ops=[[[X[0],Y[0]],[X[1],Y[1]]],[[X[0],Y[1]],[X[1],Y[0]]]];
  let best=null,bestPen=Infinity;
  ops.forEach(op=>{
    let pen=0;
    op.forEach(p=>{pen+=(parcerias.get(parKey(p[0],p[1]))||0)*1000;});
    const s1=(rank[op[0][0]]||0)+(rank[op[0][1]]||0);
    const s2=(rank[op[1][0]]||0)+(rank[op[1][1]]||0);
    pen+=Math.abs(s1-s2);            // melhor com pior => somas equilibradas
    if(pen<bestPen){bestPen=pen;best=op;}
  });
  return {pares:best,repetiu:bestPen>=1000};
}

function ehRepetida(ri,p){
  const parc=parceriasAte(ri);
  return (parc.get(parKey(p[0],p[1]))||0)>0;
}

// alterna entre as duas únicas combinações possíveis no campo
function trocarParceiros(ri,mi){
  const m=rounds[ri].matches[mi];
  if(m.done){showAlert('Corrige ou apaga o resultado antes de trocar os parceiros.','warn');return;}
  const t=m.pair1[1];m.pair1[1]=m.pair2[1];m.pair2[1]=t;
  m.repetiu=ehRepetida(ri,m.pair1)||ehRepetida(ri,m.pair2);
  renderPartidas();autoSave();
}

function gerarProximaRonda(){
  const r=rounds.length;
  if(r>=N_RONDAS)return;
  const prev=rounds[r-1];
  if(!prev.matches.every(m=>m.done)){showAlert('Regista todos os resultados da ronda atual primeiro.','warn');return;}
  const parcerias=parceriasAte(r);
  const rank=rankMap(r);
  const res=prev.matches.slice().sort((a,b)=>a.campo-b.campo).map(vp);
  const matches=[];
  for(let c=0;c<N_CAMPOS;c++){
    // quem chega ao campo c
    const X = c===0 ? res[0].W : res[c-1].L;                 // fica no topo / desce do campo de cima
    const Y = c===N_CAMPOS-1 ? res[c].L : res[c+1].W;        // fica no fundo / sobe do campo de baixo
    const comb=melhorCombinacao(X,Y,parcerias,rank);
    comb.pares.forEach(p=>{const k=parKey(p[0],p[1]);parcerias.set(k,(parcerias.get(k)||0)+1);});
    matches.push({campo:c,pair1:comb.pares[0],pair2:comb.pares[1],scores:[0,0],done:false,repetiu:comb.repetiu});
  }
  rounds.push({matches});
  renderPartidas();autoSave();
}

// ── PARTIDAS ──
function renderPartidas(){
  const cont=document.getElementById('partidas-container');
  const nrw=document.getElementById('next-round-wrap');
  if(!inscricoesFechadas||!rounds.length){
    cont.innerHTML='<div class="empty">Fecha as inscrições e gera a Ronda 1 no separador "Inscrições".</div>';
    nrw.innerHTML='';return;
  }
  let html='';
  rounds.forEach((r,ri)=>{
    const feita=r.matches.every(m=>m.done);
    const nd=r.matches.filter(m=>m.done).length;
    html+=`<div class="ronda-block">
      <div class="ronda-title">Ronda ${ri+1}
        <span class="ronda-badge ${feita?'ok':''}">${feita?'Completa':nd+' de '+r.matches.length+' registadas'}</span>
        <span class="ronda-badge">${ri===0?'Ordem de inscrição':'Sobe e desce'}</span>
      </div>`;
    r.matches.slice().sort((a,b)=>a.campo-b.campo).forEach(m=>{
      html+=matchCard(m,ri,r.matches.indexOf(m));
    });
    html+='</div>';
  });
  cont.innerHTML=html;

  const ultima=rounds[rounds.length-1];
  nrw.innerHTML=(rounds.length===N_RONDAS&&ultima.matches.every(m=>m.done))
    ? `<div class="alert alert-ok" style="margin:0;">Evento completo — vê o vencedor na Classificação.</div>` : '';
}

function matchCard(m,ri,mi){
  const badge=m.done?'<span class="badge-done">Registada</span>':'<span class="badge-pending">Pendente</span>';
  const id=`m${ri}_${mi}`;
  return `<div class="partida-card" style="--court:var(--${CAMPO_CLS[m.campo]});">
    <div class="partida-top">
      <span class="campo-badge ${CAMPO_CLS[m.campo]}">${CAMPOS[m.campo]}</span>
      ${badge}
      ${m.repetiu?'<span class="tier" style="background:rgba(242,193,76,.16);color:var(--gold);">dupla repetida</span>':''}
    </div>
    <div class="match-row">
      <div class="team-left">${nomeOf(m.pair1[0])}<br>${nomeOf(m.pair1[1])}</div>
      <div class="score-center">
        <input type="text" class="score-inp" id="${id}a" value="${m.scores[0]||''}" placeholder="0" disabled/>
        <span class="score-sep">–</span>
        <input type="text" class="score-inp" id="${id}b" value="${m.scores[1]||''}" placeholder="0" disabled/>
      </div>
      <div class="team-right">${nomeOf(m.pair2[0])}<br>${nomeOf(m.pair2[1])}</div>
    </div>
    <div class="partida-footer">
      <span style="font-size:11px;color:var(--ink-3);">jogos ganhos por dupla</span>
    </div>
  </div>`;
}

function registar(ri,mi){
  const m=rounds[ri].matches[mi];
  const a=parseInt(document.getElementById(`m${ri}_${mi}a`).value)||0;
  const b=parseInt(document.getElementById(`m${ri}_${mi}b`).value)||0;
  if(a===b){showAlert('Não pode haver empate — o Ponto de Ouro decide. Introduz valores diferentes.','warn');return;}
  const mudou=m.done&&((m.scores[0]>m.scores[1])!==(a>b));
  m.scores=[a,b];m.done=true;
  if(mudou&&ri<rounds.length-1&&confirm('Mudaste o vencedor desta partida. As rondas seguintes foram geradas com o resultado antigo. Apagá-las para voltar a gerar?')){
    rounds=rounds.slice(0,ri+1);
  }
  renderPartidas();renderClass();autoSave();
}
function apagarUltimaRonda(){
  if(!confirm(`Apagar a Ronda ${rounds.length}?`))return;
  rounds.pop();renderPartidas();renderClass();autoSave();
}

// ── CLASSIFICAÇÃO ──
function stats(){
  const st=jogadores.map((_,i)=>({idx:i,v:0,d:0,jg:0,jl:0}));
  rounds.forEach(r=>r.matches.forEach(m=>{
    if(!m.done)return;
    const[s1,s2]=m.scores;
    m.pair1.forEach(i=>{st[i].jg+=s1;st[i].jl+=s2;if(s1>s2)st[i].v++;else st[i].d++;});
    m.pair2.forEach(i=>{st[i].jg+=s2;st[i].jl+=s1;if(s2>s1)st[i].v++;else st[i].d++;});
  }));
  return st.sort((a,b)=>b.v-a.v||(b.jg-b.jl)-(a.jg-a.jl)||b.jg-a.jg);
}
function renderClass(){
  const cont=document.getElementById('class-container');
  if(!inscricoesFechadas||!rounds.length||!rounds.some(r=>r.matches.some(m=>m.done))){
    cont.innerHTML='<div class="empty">Regista resultados para ver a classificação.</div>';return;
  }
  const completo=rounds.length===N_RONDAS&&rounds.every(r=>r.matches.every(m=>m.done));
  const st=stats();
  const pc=i=>['p1','p2','p3'][i]||'pn';
  const w=st[0];
  cont.innerHTML=`<div class="card">
    <div class="card-header">
      <span class="card-title" style="margin:0;">Classificação</span>
      <span style="font-size:12px;color:var(--ink-3);">vitórias · desempate por diferença de jogos</span>
    </div>
    ${completo?`<div class="winner-strip">🏆 Vencedor: ${nomeOf(w.idx)} — ${w.v} vitórias (${w.jg-w.jl>=0?'+':''}${w.jg-w.jl})</div>`:''}
    <table class="cl-table">
      <thead><tr><th>#</th><th>Jogador</th><th class="r">V</th><th class="r">D</th><th class="r">JG</th><th class="r">JL</th><th class="r">Dif.</th></tr></thead>
      <tbody>${st.map((s,i)=>{
        const dif=s.jg-s.jl;
        return `<tr>
          <td><span class="pos-badge ${pc(i)}">${i+1}</span></td>
          <td style="font-weight:600;">${nomeOf(s.idx)}</td>
          <td class="r" style="font-weight:600;color:var(--live);">${s.v}</td>
          <td class="r">${s.d}</td><td class="r">${s.jg}</td><td class="r">${s.jl}</td>
          <td class="r" style="font-weight:600;color:${dif>=0?'var(--live)':'var(--down)'};">${dif>=0?'+':''}${dif}</td>
        </tr>`;}).join('')}</tbody>
    </table>
  </div>`;
}

// ── PERSISTÊNCIA (SÓ LEITURA) ──
// Esta página nunca escreve no bin: não há getStateObj, saveState nem doSave.
function applyState(s){
  if(!s)return;
  localVersion=s.v||0;
  jogadores=(s.jog||[]).map(n=>({nome:n}));
  inscricoesFechadas=!!s.fe&&jogadores.length===N_JOG;
  rounds=(s.rd||[]).map(r=>({matches:(r.m||[]).map(m=>({campo:m.c,pair1:m.p1,pair2:m.p2,scores:m.s||[0,0],done:!!m.d,repetiu:!!m.rp}))}));
  if(inscricoesFechadas) rascunho=jogadores.map(j=>({nome:j.nome}));
}
function autoSave(){/* só-leitura */}
const BIN_URL='https://api.jsonbin.io/v3/b/'+BIN_ID;
// cache:'no-store' evita que o browser ou um proxy sirva uma leitura antiga.
const GET_OPTS={headers:{'X-Access-Key':JSONBIN_KEY},cache:'no-store'};
function erroHttp(r){
  return r.text().catch(()=>'').then(t=>{throw new Error('HTTP '+r.status+(t?' — '+t.slice(0,160):''));});
}
function loadState(cb){
  fetch(BIN_URL+'/latest',GET_OPTS)
    .then(r=>r.ok?r.json():erroHttp(r))
    .then(d=>{if(d.record)applyState(d.record);if(cb)cb(true);})
    .catch(e=>{
      console.error('[monday-mix] falha ao ler do jsonbin',e);
      if(cb)cb(false,e);
    });
}

// ── ARRANQUE (só leitura) ──
function reRender(){
  renderInscricoes();
  if(document.getElementById('tab-partidas').classList.contains('active')) renderPartidas();
  if(document.getElementById('tab-class').classList.contains('active')) renderClass();
}
reRender();
const hhmmss=n=>String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
let ultimaLeituraOk=null;
function reloadState(){
  const el=document.getElementById('last-updated');
  if(el) el.textContent='A actualizar...';
  loadState((ok,e)=>{
    if(ok){
      reRender();
      ultimaLeituraOk=new Date();
      if(el){el.style.color='var(--ink-3)';el.textContent='Actualizado às '+hhmmss(ultimaLeituraOk);}
    } else {
      // Nunca fingir que actualizou: os dados no ecrã são os da última leitura boa.
      if(el){
        el.style.color='var(--down)';
        el.textContent=ultimaLeituraOk
          ? '⚠ Sem ligação — dados de '+hhmmss(ultimaLeituraOk)
          : '⚠ Sem ligação ao servidor — sem dados';
      }
      showAlert('Não foi possível ler o estado do evento ('+e.message+'). O que está no ecrã pode estar desactualizado.','err',true);
    }
  });
}
reloadState();
// 2 minutos em vez de 30 s: a página não precisa de mais, e o plano gratuito do
// jsonbin tem limite mensal de pedidos que um separador esquecido aberto esgota.
setInterval(reloadState,120000);
</script>
